[package]
name = "nyvora-stream"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "21.0.0", features = ["alloc"] }
soroban-ledger-snapshot = "0.0.4"

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
soroban-ledger-snapshot = "0.0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
