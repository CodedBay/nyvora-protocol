name: Build & Deploy

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Contract
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      
      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build release
        run: cargo build --target wasm32-unknown-unknown --release
      
      - name: Optimize WASM
        run: |
          cargo install soroban-cli
          soroban contract optimize --wasm target/wasm32-unknown-unknown/release/nyvora_stream.wasm
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: nyvora-stream-optimized
          path: target/wasm32-unknown-unknown/release/nyvora_stream.optimized.wasm
          retention-days: 30

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build
        working-directory: frontend
        run: npm run build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/.next
          retention-days: 30

  deploy-testnet:
    name: Deploy to Testnet
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download contract artifact
        uses: actions/download-artifact@v3
        with:
          name: nyvora-stream-optimized
          path: target/wasm32-unknown-unknown/release/
      
      - name: Install Soroban CLI
        run: cargo install soroban-cli
      
      - name: Deploy to testnet
        env:
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
        run: |
          export SOROBAN_NETWORK_PASSPHRASE="Test SDF Network ; September 2015"
          export SOROBAN_RPC_HOST="https://soroban-testnet.stellar.org"
          
          CONTRACT_ID=$(soroban contract deploy \
            --wasm target/wasm32-unknown-unknown/release/nyvora_stream.optimized.wasm \
            --source testnet-admin \
            --network testnet 2>&1 | grep -oE 'C[A-Z0-9]{55}')
          
          echo "TESTNET_CONTRACT_ID=$CONTRACT_ID" >> $GITHUB_ENV
      
      - name: Create deployment note
        run: |
          echo "## Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- **Contract ID**: ${{ env.TESTNET_CONTRACT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Network**: Testnet" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build, build-frontend]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v3
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            ## Release Notes
            
            See CHANGELOG.md for detailed changes.
            
            ### Downloads
            - `nyvora-stream-optimized.wasm` - Optimized smart contract
            - `frontend-build.tar.gz` - Frontend application
          draft: false
          prerelease: false
